<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        #imgsend{
            width: 50px;
            height: 50px;
        }
    </style>
    
 <form action="">
    <label for="nome">Seu Nome</label>
    <input type="text" id="nome" class="nome" placeholder="Digite seu nome*">
    <br><br>
    <label for="telefone">Seu Telefone</label>
    <input type="number" id="telefone" class="telefone" placeholder="Digite seu telefone*">
    <br><br>
    <label for="email">Email</label>
    <input type="email" id="email" class="email" placeholder="Digite seu email*">
    <br><br>
    <label for="masc">Deseja receber nossas novidades?</label>
    <input type="radio" id="sim" name="novidades" value="Sim">
    <label for="sim">Sim</label>
    <input type="radio" id="nao" name="novidades" value="Não">
    <label for="nao">Não</label>
    <br><br>
    <label for="msg">Sua mensagem</label>
    <textarea type="msg" id="" rows="5" cols="40" placeholder="Mensagem*"></textarea>
    <br><br> 
    <input type="submit" value="Enviar">

 </form>

</body>
</html>
