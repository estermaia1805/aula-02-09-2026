<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        #imgsend{
            width: 50px;
            height: 50px;
        }
    </style>
    
 <form action="">
    <label for="nome">Nome do usuário</label>
    <input type="text" id="nome" class="nome">
    <br><br>
    <label for="senha">Senha</label>
    <input type="password" id="senha" class="senha">
    <br><br>
    <label for="cpf">CPF</label>
    <input type="number" id="cpf" class="cpf">
    <br><br>
    <label for="datanasc">Data de nascimento</label>
    <input type="date" id="datanasc" class="datanasc">
   <br><br>
   <label for="email">Email</label>
    <input type="email" id="email" class="email">
    <br><br>
    <label for="cor">Cor do Veículo</label>
    <input type="color" id="cor" class="cor">
    <br><br>
    <label for="week">Semana de Referência</label>
    <input type="week" id="week" class="week">
    <br><br>
    <label for="vol">Volume</label>
    <input type="range" id="vol" class="vol">
    <br><br>
    <label for="masc">Masculino</label>
    <input type="radio" id="masc" name="gen" value="masculino">
    <br><br>
    <label for="fem">Feminino</label>
    <input type="radio" id="fem" name="gen" value="feminino">
    
    <br><br>
    <input type="checkbox" name="comida" id="arroz">
    <label for="comida">Arroz</label>
    <input type="checkbox" name="comida" id="feijao">
    <label for="comida">Feijão</label>
    <br><br>
    <label for="arquivo">Escolha um arquivo nos formatos: .jpg, .png, .jpeg, .pdf</label><br></br>
    <input type="file" id="arquivo" accept=".jpg, .png, .jpeg, .pdf">
    <br><br>
    <label for="url">Link do Site</label>
    <input type="url" id="url" name="url">
    <br><br>
    <label for="imgsend">Selecione sua imagem</label>
    <input type="image" src="/envio.png" id="imgsend" name="imgsend">
    <br><br>

    <label for="cidades">Selecione sua cidade:</label>
    <select name="cidade" id="">
        <option value="Montes Claros">Montes Claros</option>
        <option value="Bocaiuva">Bocaiuva</option>
        <option value="Jaíba">Jaíba</option>
    </select>

    <br><br>
    <label for="msg">Digite sua mensagem</label>
    <input type="msg" id="" rows="5" cols="40" placeholder="Digite sua mensagem aqui...">
    <br><br>
    <input type="button" value="Botão">
    <input type="submit" value="Enviar">
    <input type="reset" value="Limpar campos">

 </form>

</body>
</html>
